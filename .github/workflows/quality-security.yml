name: Quality And Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-lint-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit Tests And Release Lint
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease
      - name: Generate CycloneDX SBOM
        run: ./gradlew :app:generateSbom
      - uses: actions/upload-artifact@v4
        with:
          name: saab-tv-sbom
          path: app/build/reports/sbom/saab-tv.cdx.json

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
      - name: Build Analyzable APK
        run: ./gradlew :app:assembleDebug
      - uses: github/codeql-action/analyze@v3
