name: Release Saab TV

on:
  push:
    tags:
      - "v*"
  # Manual runs can explicitly opt into the slower Android TV emulator suite.
  # Tag-triggered release builds never start a device or emulator test job.
  workflow_dispatch:
    inputs:
      run_device_tests:
        description: Run Android TV emulator tests (not required for release builds)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'saabtv-gf/saabtv-core'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Signing Key And Configuration
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SAABTV_RELEASE_KEYSTORE_BASE64 }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          ACRA_URL: ${{ secrets.ACRA_URL }}
          ACRA_TOKEN: ${{ secrets.ACRA_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "SAABTV_RELEASE_KEYSTORE_BASE64 is not configured."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" |
            base64 --decode > "$RUNNER_TEMP/saabtv-release.jks"

          {
            printf 'tmdb.api_key=%s\n' "$TMDB_API_KEY"
            printf 'TRAKT_CLIENT_ID=%s\n' "$TRAKT_CLIENT_ID"
            printf 'TRAKT_CLIENT_SECRET=%s\n' "$TRAKT_CLIENT_SECRET"
            printf 'acra.url=%s\n' "$ACRA_URL"
            printf 'acra.token=%s\n' "$ACRA_TOKEN"
          } > local.properties

      - name: Confirm Tag Matches App Version
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SOURCE_VERSION="$(
            sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' \
              app/build.gradle.kts
          )"

          if [ "$TAG_VERSION" != "$SOURCE_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match app version $SOURCE_VERSION."
            exit 1
          fi

      - name: Test And Build Signed 32-Bit APK
        env:
          SAABTV_RELEASE_STORE_FILE: ${{ runner.temp }}/saabtv-release.jks
          SAABTV_RELEASE_STORE_PASSWORD: ${{ secrets.SAABTV_RELEASE_STORE_PASSWORD }}
          SAABTV_RELEASE_KEY_ALIAS: ${{ secrets.SAABTV_RELEASE_KEY_ALIAS }}
          SAABTV_RELEASE_KEY_PASSWORD: ${{ secrets.SAABTV_RELEASE_KEY_PASSWORD }}
        run: bash .github/scripts/release-build.sh

      - name: Retain Regression Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-and-coverage-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/jacoco/unitRegressionCoverage/
            app/build/reports/lint-results-release.*
            app/build/ci-diagnostics/
          if-no-files-found: warn

      - name: Prepare Release Files
        id: prepare
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          APK_NAME="saab-tv-${VERSION}-armeabi-v7a.apk"
          SOURCE_APK="app/build/outputs/apk/release/app-armeabi-v7a-release.apk"

          mkdir -p release
          cp "$SOURCE_APK" "release/$APK_NAME"

          HASH="$(sha256sum "release/$APK_NAME" | awk '{print $1}')"
          printf '%s  %s\n' "$HASH" "$APK_NAME" > "release/$APK_NAME.sha256"

          {
            printf 'Signed 32-bit Android TV release.\n\n'
            printf 'SHA-256 `%s`: `%s`\n' "$APK_NAME" "$HASH"
          } > release-notes.md

          if [ -f ".github/release-notes/$VERSION.md" ]; then
            cat ".github/release-notes/$VERSION.md" >> release-notes.md
          fi

          printf 'apk=%s\n' "release/$APK_NAME" >> "$GITHUB_OUTPUT"
          printf 'checksum=%s\n' "release/$APK_NAME.sha256" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.prepare.outputs.apk }}
          CHECKSUM: ${{ steps.prepare.outputs.checksum }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$APK" \
            "$CHECKSUM" \
            --verify-tag \
            --latest \
            --title "Saab TV $VERSION" \
            --generate-notes \
            --notes "$(cat release-notes.md)"

  device-tests:
    if: github.repository == 'saabtv-gf/saabtv-core' && github.event_name == 'workflow_dispatch' && inputs.run_device_tests
    runs-on: macos-15-intel
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android TV Emulator Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: tv_1080p
          cores: 4
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-metrics -noaudio -no-boot-anim -camera-back none -cores 4
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/device-tests.sh

      - name: Retain Emulator Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-tv-emulator-test-reports
          path: |
            app/build/reports/androidTests/connected/debug/
            app/build/outputs/androidTest-results/connected/debug/
            app/build/ci-diagnostics/
          if-no-files-found: warn
